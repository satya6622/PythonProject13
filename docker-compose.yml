services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: wallet, POSTGRES_USER: wallet, POSTGRES_PASSWORD: wallet }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"], interval: 3s, timeout: 3s, retries: 20 }
    volumes: ["./migrations/001_wallet.sql:/docker-entrypoint-initdb.d/001_wallet.sql:ro"]
  api:
    build: .
    environment: { DATABASE_URL: postgresql://wallet:wallet@db:5432/wallet }
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment: { DATABASE_URL: postgresql://wallet:wallet@db:5432/wallet }
    depends_on: { db: { condition: service_healthy } }
